name: 2space
services:
  app:
    build:
      context: .
      target: production
    image: 2space:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3210}:3210"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3210"
      DB_PATH: /data/2space.sqlite
      WEB_DIST: /app/apps/web/dist
    volumes:
      - space-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  space-data:
