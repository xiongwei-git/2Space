name: Validate 2Space
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:links
      - run: npm run test:parity
      - run: npm run design:check
      - run: npx playwright install --with-deps chromium
      - name: Reading baseline, accessibility and screenshots
        run: node scripts/visual-acceptance.mjs
      - name: Reading acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-acceptance
          path: output/design-acceptance/
          retention-days: 7
          if-no-files-found: ignore
      - run: docker build --target production --tag 2space:ci .
      - name: Docker API acceptance
        run: |
          docker run -d --name 2space-ci -p 127.0.0.1:3210:3210 2space:ci
          trap 'docker stop 2space-ci' EXIT
          node scripts/acceptance.mjs
