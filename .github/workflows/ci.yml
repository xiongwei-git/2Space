name: Validate 2Space
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:links
      - run: npm run test:parity
      - run: npm run design:check
      - run: npx playwright install --with-deps chromium
      - name: Reading baseline, accessibility and screenshots
        run: node scripts/visual-acceptance.mjs
      - name: Interface language acceptance
        run: node scripts/locale-acceptance.mjs
      - name: Browser password encryption acceptance
        run: node scripts/protection-acceptance.mjs
      - name: Reading acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-acceptance
          path: |
            output/design-acceptance/
            output/protection-acceptance/
          retention-days: 7
          if-no-files-found: ignore
      - name: One-command Docker deployment
        run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Docker API and restart acceptance
        run: ACCEPTANCE_RESTART=1 node scripts/acceptance.mjs
      - name: Docker logs
        if: failure()
        run: docker compose logs --tail=60 app
      - name: Stop Docker deployment
        if: always()
        run: docker compose down
